name: Upload content to WeChat Cloud

on:
  push:
    branches: [main]
    paths: ['content/**']
  workflow_dispatch:
    inputs:
      all:
        description: 'Upload every file in content/ (not just changed ones)'
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Work out which files changed
        id: files
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- content | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
      - name: Make sure audio plays on phones (44.1 kHz mp3)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          find content/audio -name '*.mp3' | while read -r f; do
            sr=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "$f")
            if [ "$sr" != "44100" ]; then ffmpeg -v error -y -i "$f" -ar 44100 -ac 1 -b:a 64k "$f.tmp.mp3" && mv "$f.tmp.mp3" "$f" && echo "re-encoded $f"; fi
          done
      - name: Upload
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: node scripts/upload-to-wechat.mjs ${{ steps.files.outputs.list }}
